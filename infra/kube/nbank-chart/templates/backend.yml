apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend # kubectl get deployment backend - логи посмотреть как прошёл деплой
spec:
  replicas: 1 #количество копий POD
  selector:
    matchLabels:
      app: backend #связываем deployment и pod
  template:
    metadata:
      labels:
        app: backend #устанаваливаем лейбл на под
      annotations:
        co.elastic.logs/enabled: "true"
        co.elastic.logs/module: springboot
        co.elastic.logs/json.keys_under_root: "true"
        co.elastic.logs/json.add_error_key: "true"
    spec:
      containers:
        - name: backend
          image: nobugsme/nbank:preprod_version
          imagePullPolicy: Always
          ports:
            - containerPort: 4111
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/nbank
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              value: postgres
            - name: FRAUD_DETECTION_SERVICE_URL
              value: http://host.minikube.internal:8080
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 4111
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 4111
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 20

---

apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: backend
spec:
  selector:
    app: backend #сервис который мы написали будет направлять трафик на поды у которых app = backend
  ports:
    - name: http
      protocol: TCP
      port: 4111 # порт на котором работает сервис
      targetPort: 4111 # куда пересылать внутри пода (контейнер слушает этот порт)
  type: NodePort # ClusterIP (доступен только внутри кластера), NodePort (открывает порт на всех нодах кластера)