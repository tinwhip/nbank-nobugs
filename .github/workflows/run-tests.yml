name: Run tests

#триггер
on: [ push, workflow_dispatch ]


jobs: # аналог этапов
  run-tests:
    name: Set up services (review apps) and run tests
    runs-on: ubuntu-24.04-arm
    steps: #шаги конкретной job
      - name: Checkout Repository #копируем файлы репозитория внутрь CI агента (раннера)
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up services
        run: cd infra/docker_compose && bash restart_docker.sh && cd ../..

      - name: Show Docker diagnostics
        if: always()
        working-directory: infra/docker_compose
        run: |
            echo "=== Docker Compose status ==="
            docker compose ps -a
            
            echo "=== Selenoid logs ==="
            docker compose logs --no-color --tail=500 selenoid || true
          
            echo "=== Selenoid healthcheck ==="
            SELENOID_ID=$(docker compose ps -q selenoid)
            
            if [ -n "$SELENOID_ID" ]; then
              docker inspect "$SELENOID_ID" \
                --format='Status={{.State.Status}} Health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}'
            
              docker inspect "$SELENOID_ID" \
                --format='{{range .State.Health.Log}}{{println "ExitCode:" .ExitCode}}{{println .Output}}{{end}}'
            else
              echo "Selnoid container was not created"
            fi

      - name: Run tests
        run: ./mvnw clean test -q
        env:
          APIBASEURL: http://localhost:4111
          UIBASEURL: http://localhost:3000